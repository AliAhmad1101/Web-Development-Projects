            height: 260px;
            object-fit: cover;
            pointer-events: none;

    <script>
        const params = new URLSearchParams(window.location.search);

        const genre = params.get("genre")?.toLowerCase() || "";
        const rating = params.get("rating") ? parseFloat(params.get("rating")) : "";
        const year = params.get("year") ? parseInt(params.get("year")) : "";
        fetch("movies.json")
            .then(res => res.json())
            .then(data => {

                const container = document.getElementById("recommendations");
                const filtered = data.filter(movie => {

                    const matchesGenre = genre
                        ? movie.genre.toLowerCase().includes(genre)
                        : true;

                    const matchesRating = rating
                        ? movie.score >= rating
                        : true;

                    const matchesYear = year
                        ? movie.year >= year
                        : true;

                    return matchesGenre && matchesRating && matchesYear;
                });
                if (filtered.length === 0) {
                    container.innerHTML =
                        "<p style='color:white; padding-left:20px;'>No movies found matching your criteria.</p>";
                    return;
                }
                filtered.forEach(movie => {

                    const card = document.createElement("div");
                    card.classList.add("rec-card");

                    card.innerHTML = `<img src="${movie.poster}" class="rec-poster">`;

                    card.onclick = () => {
                        window.location.href = `movie.html?movie=${encodeURIComponent(movie.name)}`;
                    };

                    container.appendChild(card);
                });

            });
    </script>
</body>
