<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECM-Registration</title>
    <link rel="shortcut icon" href="education.png" type="image/png">
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background-color: rgb(226, 220, 220);
        }

        .main-grid{
            display: grid;
            gap: 2px;
            background-color: black;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 50px 50px;
            border: 2px solid black;
            overflow: hidden;
        }

        .gridlogo{
            background-color: rgb(252, 186, 63);
            text-align: center;
            grid-column: span 1;
            grid-row: span 1;
            padding-top: 10px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 300;
            font-size: 1.4rem;
        }

        .gridtitle{
            background-color: rgb(252, 186, 63);
            text-align: center;
            grid-column: span 4;
            grid-row: span 1;  
            font-size: 1.3rem;
            font-family: Georgia, 'Times New Roman', Times, serif;
            padding-top: 10px;          
        }

        .griditem{
            background-color: rgb(252, 216, 151);
            text-align: center;
            grid-column: span 1;
            grid-row: span 1;
            padding-top: 15px;
            font-size: 1.2rem;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            transition: all 0.3s ease-in-out;
        }

        .griditem:hover{
            transform: scale(1.05);
            background-color: black;
            color: white;
        }

        .content{
            display: flex;
        }

        .aside{
            width: 300px;
            height: 40.5vw;
            margin: 5px;
            background-color: rgb(255, 255, 255);
        }

        a{
            color: black;
            text-decoration: none;
        }

        a:hover{
            color: white;
        }

        .main{
            background-color: white;
            width: 80%;
            height: 40.5vw;
            margin: 5px;
            overflow: auto;
        }

        .selections{
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        button{
            background-color: transparent;
            border: transparent;
            padding: 20px;
            font-size: 1rem;
            margin: 10px;
            transition: all 0.7 ease;
            cursor: pointer;
        }

        button:hover{
            transform: scale(1.2);
            border-bottom: 1px solid black;
            border-top: 1px solid black;
        }

        form{
            width: 40vw;
            height: 28vw;
            background-color: rgb(227, 220, 220);
            border-radius: 24px;
            text-align: center;
            padding: 44px 24px 24px 24px;
            margin: 40px 40px 0px 280px;
        }

        label{
            font-size: 1.1rem;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-top: 5px;
        }

        input[type="text"]{
            width: 80%;
            height: 2vw;
            border: transparent;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        input[type="password"]{
            width: 72%;
            height: 2vw;
            border: transparent;
            margin-left: 30px;
            margin-bottom: 20px;            
        }
        
        .form-button{
            background-color: white;
            border: transparent;
            padding: 10px 20px 10px 20px;
            border-radius: 12px;
            margin-top: 1px;
        }

        .reset-button{
            background-color: white;
            border: transparent;
            padding: 10px 20px 10px 20px;
            border-radius: 12px;
            margin-top: 15px;
            margin-left: 50px;            
        }

        .form-button:hover, .reset-button:hover{
            background-color: black;
            color: white;
        }

        input[type="radio"]{
            background-color: transparent;
            margin-left: 180px;
            margin-right: 10px;
        }

        input[type="date"]{
            width: 78%;
            height: 2vw;
            border: transparent;
            margin-left: 20px;
            margin-bottom: 20px;
            margin-top: 15px;
        }

        input[type="checkbox"]{
            margin-left: 95px;
        }

        #area{
            background-color:white;
            border-radius: 12px;
            width: 100%;
            height: 4vw;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        #area::placeholder{
            padding: 5px;
        }

        #mail{
            width: 78%;
            height: 2vw;
            border: transparent;
            margin-left: 30px;
            margin-bottom: 20px;             
        }

    </style>
</head>
<body>
    <div class="main-grid">
        <div class="gridlogo">ECM</div>
        <div class="gridtitle">Maharana Pratap Engineering College - E-Commerce Website</div>
        <div class="griditem"><a href="index.html">Home</a></div>
        <div class="griditem"><a href="login.html">Login</a></div>
        <div class="griditem"><a href="registration.html">Registration</a></div>
        <div class="griditem"><a href="catalogue.html">Catalogue</a></div>
        <div class="griditem"><a href="cart.html">Cart</a></div>
    </div>
    <div class="content">
    <div class="aside">
        <div class="selections">
            <button><a href="cse.html" onmouseover="this.style.color='black'">CSE</a></button>
            <button><a href="ece.html" onmouseover="this.style.color='black'">ECE</a></button>
            <button><a href="eee.html" onmouseover="this.style.color='black'">EEE</a></button>
            <button><a href="civil.html" onmouseover="this.style.color='black'">CIVIL</a></button>
        </div>
    </div>
    <div class="main">
        <h1 style="font-size: 28px; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: center; margin-top: 1vw;">Register yourself</h1>
        <form action="post">
            <label for="name">Enter Name: </label><input type="text" name="name" id="name"><br>
            <label for="pass">Create Password: </label><input type="password" name="pass" id="pass"><br>
            <label for="mail">Enter Email: </label><input type="email" name="mail" id="mail"><br>
            <label for="phone">Phone No : </label><input type="text" name="phone" id="phone"><br>
            <label for="gender">Gender : </label><input type="radio" name="gender" id="gender"><label for="gender">Male </label><input type="radio" name="gender" id="gender"><label for="gender" >Female </label><br>
            <label for="date" style="margin-top: 20px;">Date of Birth : </label><input type="date" name="date" id="date"><br>
            <label for="lang">Languages : </label> <input type="checkbox" name="lang" id="lang"> <label for="lang">English </label> <input type="checkbox" name="lang" id="lang"> <label for="lang">Hindi </label> <input type="checkbox" name="lang" id="lang"> <label for="lang">Punjabi </label><br>
            <textarea name="area" id="area" placeholder="Enter your address here"></textarea>
            <input type="button" value="Submit" class="form-button" >
        </form>
    </div>
    </div>
</body>
</html>
