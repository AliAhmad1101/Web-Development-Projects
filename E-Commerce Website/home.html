<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <style>
        nav{
            display: flex;
            top: 0;
            justify-content: space-between;
        }

        h1{
            margin: 0;
            font-size: 24px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-left: 160px;
        }

        span{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-style: oblique;
        }

        button{
            padding: 8px 16px 8px 16px;
            border-radius: 10px;
            background-color: transparent;
            font-size: 15px;
            margin: 0 5px 0 5px;
        }

        .main{
            justify-content: center;
            align-items: center;
            display: flex;
            margin-top: 150px;

        }

        .hero{
            height: 500px;
            width: 700px;
        }

        h2{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 24px;
            text-align: center;
        }

        form{
            background-color: whitesmoke;
            height: 200px;
            border-radius: 24px;
            margin-top: 40px;
            padding: 26px;
        }

        label{
            color: black;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 16px;
            padding: 10px;
        }

        input[type="text"]{
            width: 70%;
            padding: 7px;
            margin: 8px;
            border: 1px solid grey;
            background-color: rgb(255, 252, 252);
        }

        input[type="password"]{
            width: 70%;
            padding: 7px;
            margin: 15px;
            border: 1px solid grey;
            background-color: rgb(255, 252, 252);
        }


    </style>
</head>
<body>
    <nav>
        <span>ECM</span>
        <h1>E - Commerce Website</h1>
        <div class="btns">
            <button>Login</button>
            <button>Registration</button>
            <button>Catalogue</button>
            <button style="background-color: black; color: white;">Cart</button>
        </div>
    </nav>

    <div class="main">
    <div class="hero">
        <h2>Login</h2>
        <form action="">
            <label for="name">User Name: </label><input type="text" name="name" id="name"><br>
            <label for="name">Password: </label><input type="password" name="pass" id="pass"><br>
            <button style="margin-left: 35%;margin-top: 20px; color: white; background-color: black;">Submit</button>
            <button>Reset</button>

        </form>
    </div>
    </div>
</body>
</html>
